# 站点设置
title: UNIC 实验室本科生实习招生
description: >
  泛在网络与智能计算研究组（UNIC）诚邀优秀本科生加入我们的实习项目。
  在这里，你将接触前沿的学术研究，与一流的研究团队合作，
  在6G网络、空天地一体化网络、车联网等多个研究方向中发现自己的热情。
baseurl: ""
url: "https://unic-lab.github.io"
